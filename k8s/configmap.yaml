apiVersion: v1
kind: ConfigMap
metadata:
  name: loantrack-config
  namespace: loantrack
  labels:
    app.kubernetes.io/name: loantrack
data:
  # Backend connection
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_NAME: "loantrack"
  DB_USER: "loantrack_user"

  # Postgres container
  POSTGRES_DB: "loantrack"
  POSTGRES_USER: "loantrack_user"
